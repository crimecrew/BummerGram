name: Build BummerGram (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt6 via GitHub Cache
      shell: cmd
      run: |
        vcpkg install qtbase:x64-windows qt5compat:x64-windows --binarysource="clear;nuget,GitHub,readwrite"

    - name: Configure CMake and Build BummerGram
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ..
        cmake --build . --config Release

    - name: Upload Finished BummerGram Binary
      uses: actions/upload-artifact@v4
      with:
        name: BummerGram-Windows-x64
        path: build/bin/Release/BummerGram.exe
