name: Build BummerGram (Windows Official)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2 and Install Qt6
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-qt6-multimedia
          mingw-w64-x86_64-lua

    - name: Configure and Build BummerGram
      shell: msys2 {0}
      run: |
        rm -rf build
        mkdir build
        cd build
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
        ninja

    - name: Upload Finished BummerGram Binary
      uses: actions/upload-artifact@v4
      with:
        name: BummerGram-Windows-x64
        path: build/BummerGram.exe
