name: Build BummerGram (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Official CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Download and Extract Standard Qt6 Binaries
      shell: powershell
      run: |
        Write-Host "Downloading pre-compiled stable Qt6 package..."
        $url = "https://github.com"
        Invoke-WebRequest -Uri $url -OutFile "C:\qt6_base.zip"
        Write-Host "Extracting binaries directly to C:\Qt6..."
        Expand-Archive -Path "C:\qt6_base.zip" -DestinationPath "C:\Qt6" -Force

    - name: Configure CMake and Build BummerGram
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt6" ..
        cmake --build . --config Release

    - name: Upload Finished BummerGram Binary
      uses: actions/upload-artifact@v4
      with:
        name: BummerGram-Windows-x64
        path: build/bin/Release/BummerGram.exe
